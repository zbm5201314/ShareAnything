<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="svg/favicon.svg">
<title>加我为好友</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh; padding:40px 20px;
  }
  h1 { text-align:center; color:#fff; font-size:2rem; margin-bottom:10px;
       text-shadow:0 2px 10px rgba(0,0,0,.3); }
  .subtitle { text-align:center; color:rgba(255,255,255,.85); margin-bottom:40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
          gap:28px; max-width:1300px; margin:0 auto; }
  .card { background:#fff; border-radius:18px; padding:20px; text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.2); transition:transform .25s ease; }
  .card:hover { transform:translateY(-8px); box-shadow:0 18px 40px rgba(0,0,0,.3); }
  .img-box { width:100%; height:220px; background:#fafafa; border-radius:12px;
             display:flex; align-items:center; justify-content:center;
             cursor:zoom-in; overflow:hidden; }
  .img-box img { width:100%; height:100%; object-fit:contain; }
  .card h3 { margin-top:14px; color:#333; }
  .card p { font-size:.85rem; color:#888; margin-top:4px; }
  .card a { display:inline-block; margin-top:10px; padding:6px 18px;
            background:linear-gradient(135deg,#667eea,#764ba2); color:#fff;
            border-radius:20px; text-decoration:none; font-size:.85rem; }

  /* 点击放大遮罩层 */
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88);
              display:none; align-items:center; justify-content:center;
              z-index:999; cursor:zoom-out; flex-direction:column; gap:16px; }
  #lightbox img { width:520px; height:520px; max-width:88vw; max-height:78vh;
                  background:#fff; border-radius:16px; padding:12px;
                  object-fit:contain; image-rendering:auto; }
  #lightbox .tip { color:#fff; font-size:.9rem; opacity:.8; }
</style>
</head>
<body>

<h1>📲 我的二维码展示墙</h1>
<p class="subtitle">点击二维码可放大预览 · 打开对应手机APP扫码即可添加我为好友!</p>

<div class="grid">

  <div class="card">
    <div class="img-box" onclick="showLightbox('png/dingtalk.png')">
      <img src="png/dingtalk.png" alt="钉钉二维码">
    </div>
    <h3>钉钉</h3><p>DingTalk</p>
    <a href="png/dingtalk.png" download="钉钉.png">⬇ 下载二维码</a>
  </div>

  <div class="card">
    <div class="img-box" onclick="showLightbox('png/alipay.png')">
      <img src="png/alipay.png" alt="支付宝二维码">
    </div>
    <h3>支付宝</h3><p>Alipay</p>
    <a href="png/alipay.png" download="支付宝.png">⬇ 下载二维码</a>
  </div>

  <div class="card">
    <div class="img-box" onclick="showLightbox('png/tiktok.png')">
      <img src="png/tiktok.png" alt="抖音二维码">
    </div>
    <h3>抖音</h3><p>TikTok</p>
    <a href="png/tiktok.png" download="抖音.png">⬇ 下载二维码</a>
  </div>

  <div class="card">
    <div class="img-box" onclick="showLightbox('png/qq.png')">
      <img src="png/qq.png" alt="QQ二维码">
    </div>
    <h3>QQ</h3><p>Tencent QQ</p>
    <a href="png/qq.png" download="QQ.png">⬇ 下载二维码</a>
  </div>

  <div class="card">
    <div class="img-box" onclick="showLightbox('png/wechat.png')">
      <img src="png/wechat.png" alt="微信二维码">
    </div>
    <h3>微信</h3><p>WeChat</p>
    <a href="png/wechat.png" download="微信.png">⬇ 下载二维码</a>
  </div>

</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" src="" alt="预览">
  <div class="tip">点击空白处关闭</div>
</div>

<script>
  function showLightbox(src) {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").style.display = "flex";
  }
</script>

</body>
</html>
